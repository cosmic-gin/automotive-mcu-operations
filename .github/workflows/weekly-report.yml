name: Weekly fictional operations report
on:
  schedule:
    - cron: '17 7 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      MCU_BACKEND: duckdb
      MCU_DATA_DIR: data/scheduled
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install .
      - run: python -m mcu_ops.reporting --live
      - name: Archive report and monitoring evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fictional-operations-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            reports/**/*.md
            data/scheduled/etl/quality/*/quality.json
            data/scheduled/etl/quality/*/quarantine.csv
            data/scheduled/etl/executions/*.json
